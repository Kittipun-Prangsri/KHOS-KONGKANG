version: '3.8'

services:
  # MySQL 8.0 Database Container
  db:
    image: mysql:8.0
    container_name: computer_stock_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: computer_stock
      MYSQL_USER: stock_app
      MYSQL_PASSWORD: stockpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./stock_computer_schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./stock_triggers_procedures.sql:/docker-entrypoint-initdb.d/2_triggers.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Express Backend API & Dashboard App Container
  app:
    build: .
    container_name: computer_stock_app
    restart: always
    ports:
      - "5189:5189"
    environment:
      NODE_ENV: production
      PORT: 5189
      DB_HOST: db
      DB_USER: stock_app
      DB_PASSWORD: stockpassword
      DB_NAME: computer_stock
      DB_PORT: 3306
      AUTH_USER: ${AUTH_USER:?ต้องตั้ง AUTH_USER}
      AUTH_PASSWORD: ${AUTH_PASSWORD:?ต้องตั้ง AUTH_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data:
