<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>คลังวัสดุคอมพิวเตอร์ — รพ.คลองหาด</title>
  <link rel="stylesheet" href="/assets/app.css">
  <script src="/js/theme.js"></script>
</head>
<body class="min-h-screen">
  <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden no-print" aria-hidden="true">
    <div class="absolute -top-40 -right-40 size-[40rem] rounded-full bg-teal-400/15 blur-[120px] dark:bg-teal-500/15"></div>
    <div class="absolute -bottom-40 -left-40 size-[36rem] rounded-full bg-indigo-400/15 blur-[120px] dark:bg-indigo-500/15"></div>
  </div>

  <div class="mx-auto flex min-h-screen max-w-[1500px]">

    <!-- เมนูข้าง (จอใหญ่) -->
    <aside class="no-print sticky top-0 hidden h-screen w-64 shrink-0 flex-col gap-1 p-4 lg:flex">
      <div class="mb-4 flex items-center gap-3 px-2 py-2">
        <div class="grid size-10 place-items-center rounded-2xl bg-gradient-to-br from-teal-500 to-emerald-600 text-white shadow-lg shadow-teal-600/30">
          <svg viewBox="0 0 24 24" class="size-5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/></svg>
        </div>
        <div class="leading-tight"><p class="text-sm font-semibold">คลังวัสดุคอมพิวเตอร์</p><p class="text-[11px] text-slate-500 dark:text-slate-400">รพ.คลองหาด</p></div>
      </div>
      <nav id="nav" class="grid gap-1" aria-label="เมนูหลัก"></nav>
      <div class="mt-auto grid gap-2">
        <button id="cmdBtn" class="btn btn-soft w-full justify-between !px-3 text-slate-500" type="button"><span>ค้นหาวัสดุ…</span><kbd class="rounded-md bg-slate-900/10 px-1.5 text-[11px] dark:bg-white/10">⌘K</kbd></button>
        <div class="card flex items-center gap-3 p-3">
          <div id="meAvatar" class="grid size-9 shrink-0 place-items-center rounded-full bg-gradient-to-br from-indigo-400 to-teal-400 text-sm font-semibold text-white"></div>
          <div class="min-w-0 flex-1 leading-tight"><p id="meName" class="truncate text-sm font-medium"></p><p id="meRole" class="text-xs text-slate-500 dark:text-slate-400"></p></div>
          <button id="logoutBtn" class="btn btn-soft !p-2" type="button" title="ออกจากระบบ" aria-label="ออกจากระบบ">⎋</button>
        </div>
      </div>
    </aside>

    <div class="flex min-w-0 flex-1 flex-col">
      <!-- แถบบน -->
      <header class="no-print sticky top-0 z-30 flex items-center gap-3 border-b border-slate-200/60 bg-slate-50/80 px-4 py-3 backdrop-blur-xl sm:px-6 dark:border-white/10 dark:bg-slate-950/70">
        <div class="flex items-center gap-2 lg:hidden"><span class="font-semibold">คลังวัสดุ</span></div>
        <div id="syncPill" class="hidden items-center gap-2 rounded-full bg-slate-900/5 px-3 py-1.5 text-xs text-slate-600 sm:flex dark:bg-white/10 dark:text-slate-300"></div>
        <div class="ml-auto flex items-center gap-2">
          <button id="cmdBtnTop" class="btn btn-soft !px-3 lg:hidden" type="button" aria-label="ค้นหา">🔍</button>
          <button id="themeBtn" class="btn btn-soft !px-3" type="button" aria-label="สลับโหมดมืด/สว่าง"><span data-theme-icon>◐</span></button>
          <button id="logoutBtnTop" class="btn btn-soft !px-3 lg:hidden" type="button" aria-label="ออกจากระบบ">⎋</button>
        </div>
      </header>

      <main id="view" class="flex-1 px-4 pt-6 pb-28 sm:px-6 lg:pb-10" tabindex="-1"></main>

      <!-- ท้ายหน้า -->
      <footer class="no-print border-t border-slate-200/60 px-6 py-6 text-center text-xs text-slate-500 lg:pb-6 dark:border-white/10 dark:text-slate-400">
        <p>ระบบบัญชีรับ-จ่ายวัสดุคอมพิวเตอร์ · โรงพยาบาลคลองหาด · หน่วยเทคโนโลยีสารสนเทศ</p>
        <p class="mt-1">พัฒนาโดย <span class="font-medium text-slate-700 dark:text-slate-200">Kittipun Prangsri</span> · © 2569</p>
      </footer>
    </div>
  </div>

  <!-- เมนูล่าง (มือถือ) -->
  <nav id="bottomNav" class="no-print fixed inset-x-0 bottom-0 z-40 grid border-t border-slate-200/70 bg-white/90 px-2 pt-1.5 pb-[max(.5rem,env(safe-area-inset-bottom))] backdrop-blur-xl lg:hidden dark:border-white/10 dark:bg-slate-950/90" aria-label="เมนูหลัก"></nav>

  <div id="overlay"></div>
  <div id="toasts" class="pointer-events-none fixed right-4 bottom-24 z-[60] grid gap-2 lg:bottom-6"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
